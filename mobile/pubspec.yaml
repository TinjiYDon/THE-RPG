name: the_rpg_mobile
description: Mobile client for THE-RPG (Flutter)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/events/evt_town_contract_001.json
    - assets/events/evt_town_rumor_001.json
    - assets/events/evt_wild_implant_001.json
    - assets/events/evt_dun_affix_001.json
    - assets/events/evt_story_choice_001.json

